<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anyoka Foundation — Where Young Minds Catch Great Ideas</title>
  <meta name="description" content="Anyoka Foundation is a Ghanaian NGO working to build cognitive development tools for children ages 1 to 24, based in Tema, Greater Accra.">
  <meta property="og:title" content="Anyoka Foundation">
  <meta property="og:description" content="Where Young Minds Catch Great Ideas. Based in Tema, Ghana.">
  <meta property="og:image" content="assets/logo.png">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Design tokens -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="mobile.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--font-sans); line-height: 1.6; }
    a { color: var(--green); }
    a:hover { color: var(--green-mid); }
    img { max-width: 100%; }
  </style>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <!-- Design System bundle -->
  <script src="ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
  // =====================
  // SITE NAV BAR
  // =====================
  const { Button } = window.AnyokaFoundationDesignSystem_a7532e;

  const LINKS = ['About', 'Programs', 'Our Resources', 'School Donations', 'Blog', { label: 'Games', items: ['Free Games', 'Anyoka Play'] }, 'Contact'];

  function SiteNavBar({ links = LINKS, active, onNavigate, logoSrc = 'assets/logo.png', sticky = true }) {
    const [hov, setHov] = React.useState(null);
    const [open, setOpen] = React.useState(null);
    const [menu, setMenu] = React.useState(false);
    const goTo = (s) => { setMenu(false); onNavigate && onNavigate(s); };
    const flat = links.flatMap((raw) => typeof raw === 'string' ? [raw] : (raw.items && raw.items.length ? raw.items : [raw.label]));
    const closeTimer = React.useRef(null);
    const enter = (k) => { clearTimeout(closeTimer.current); setOpen(k); };
    const leave = () => { closeTimer.current = setTimeout(() => setOpen(null), 160); };
    const linkStyle = (isActive, isHov) => ({
      fontSize: 14, fontWeight: isActive ? 700 : 500, textDecoration: 'none',
      color: isActive || isHov ? 'var(--green)' : 'var(--ink)',
      position: 'relative', padding: '4px 0', transition: 'color 0.2s', whiteSpace: 'nowrap',
      display: 'flex', alignItems: 'center', gap: 5, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit',
    });
    return (
      <nav style={{
        position: sticky ? 'sticky' : 'static', top: 0, zIndex: 200,
        background: 'var(--nav-bg)', backdropFilter: 'var(--nav-blur)', WebkitBackdropFilter: 'var(--nav-blur)',
        borderBottom: '1px solid var(--border)', padding: '0.9rem 2rem',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontFamily: 'var(--font-sans)',
      }}>
        <style>{'.ank-burger{display:none}@media (max-width:900px){.ank-links{display:none!important}.ank-burger{display:flex!important}}@media (max-width:480px){.ank-nav-pad{padding:0.75rem 1rem!important}}'}</style>
        <a href="#" onClick={(e) => { e.preventDefault(); onNavigate && onNavigate('Home'); }} style={{ display: 'flex', alignItems: 'center', gap: 10, textDecoration: 'none' }}>
          <img src={logoSrc} alt="Anyoka Foundation logo" style={{ width: 36, height: 'auto', display: 'block' }} />
          <span style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.1 }}>
            <strong style={{ fontFamily: 'var(--font-serif-display)', fontSize: 16, fontWeight: 600, color: 'var(--green)' }}>Anyoka</strong>
            <span style={{ fontSize: 9, letterSpacing: '0.08em', color: 'var(--gray)', textTransform: 'uppercase' }}>Foundation</span>
          </span>
        </a>
        <button type="button" className="ank-burger" aria-label={menu ? 'Close menu' : 'Open menu'} aria-expanded={menu} onClick={() => setMenu(!menu)}
          style={{ width: 44, height: 44, alignItems: 'center', justifyContent: 'center', background: 'none', border: '1px solid var(--border)', borderRadius: 12, cursor: 'pointer', color: 'var(--green)' }}>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">{menu ? <path d="M4 4l12 12M16 4L4 16"/> : <path d="M3 6h14M3 10h14M3 14h14"/>}</svg>
        </button>
        {menu && (
          <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'var(--cream)', borderBottom: '1px solid var(--border)', boxShadow: '0 14px 30px rgba(31,29,24,0.12)', padding: '0.6rem 1rem 1.2rem', display: 'flex', flexDirection: 'column', gap: 2, maxHeight: 'calc(100vh - 70px)', overflowY: 'auto' }}>
            {flat.map((item) => (
              <a key={item} href="#" onClick={(e) => { e.preventDefault(); goTo(item); }}
                style={{ fontSize: 16, fontWeight: active === item ? 700 : 500, textDecoration: 'none', color: active === item ? 'var(--green)' : 'var(--ink)', padding: '12px 10px', borderRadius: 10, background: active === item ? 'var(--green-pale)' : 'transparent', minHeight: 44, boxSizing: 'border-box', display: 'flex', alignItems: 'center' }}>{item}</a>
            ))}
            <a href="#" onClick={(e) => { e.preventDefault(); goTo('Donate'); }} style={{ marginTop: '0.6rem', minHeight: 48, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--green)', color: '#fff', fontWeight: 700, fontSize: 16, textDecoration: 'none', borderRadius: 'var(--radius-pill)' }}>Donate</a>
          </div>
        )}
        <div className="ank-links" style={{ display: 'flex', gap: '1.8rem', alignItems: 'center' }}>
          {links.map((raw) => {
            const l = typeof raw === 'string' ? { label: raw } : raw;
            const isGroup = l.items && l.items.length;
            const isActive = isGroup ? l.items.includes(active) : active === l.label;
            const isHov = hov === l.label || open === l.label;
            if (!isGroup) {
              return (
                <a key={l.label} href="#" onClick={(e) => { e.preventDefault(); onNavigate && onNavigate(l.label); }}
                  onMouseEnter={() => setHov(l.label)} onMouseLeave={() => setHov(null)} style={linkStyle(isActive, isHov)}>
                  {l.label}
                  <span style={{ position: 'absolute', bottom: 0, left: 0, height: 2, background: 'var(--gold)', transition: 'width 0.25s', width: isHov ? '100%' : 0 }}></span>
                </a>
              );
            }
            return (
              <div key={l.label} style={{ position: 'relative' }} onMouseEnter={() => enter(l.label)} onMouseLeave={leave}>
                <button type="button" onClick={() => setOpen(open === l.label ? null : l.label)} style={linkStyle(isActive, isHov)}>
                  {l.label}
                  <svg width="9" height="6" viewBox="0 0 10 6" fill="none" style={{ transform: open === l.label ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}><path d="M1 1l4 4 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  <span style={{ position: 'absolute', bottom: 0, left: 0, height: 2, background: 'var(--gold)', transition: 'width 0.25s', width: isHov ? '100%' : 0 }}></span>
                </button>
                {open === l.label && (
                  <div style={{ position: 'absolute', top: 'calc(100% + 12px)', left: '50%', transform: 'translateX(-50%)', background: '#fff', border: '1px solid var(--border)', borderRadius: 14, boxShadow: '0 14px 34px rgba(31,29,24,0.13)', padding: 6, minWidth: 172, display: 'flex', flexDirection: 'column', gap: 2 }}>
                    {l.items.map((item) => (
                      <a key={item} href="#" onClick={(e) => { e.preventDefault(); setOpen(null); onNavigate && onNavigate(item); }}
                        onMouseEnter={() => setHov(item)} onMouseLeave={() => setHov(null)}
                        style={{ fontSize: 13.5, fontWeight: active === item ? 700 : 500, textDecoration: 'none', color: active === item ? 'var(--green)' : 'var(--ink)', padding: '9px 12px', borderRadius: 9, background: hov === item ? 'var(--green-pale)' : 'transparent', whiteSpace: 'nowrap', transition: 'background 0.15s, color 0.15s' }}>
                        {item}
                      </a>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
          <Button variant="nav" href="#" onClick={(e) => { e.preventDefault(); onNavigate && onNavigate('Donate'); }}>Donate</Button>
        </div>
      </nav>
    );
  }

  // =====================
  // HOME SCREEN
  // =====================
  const DS = window.AnyokaFoundationDesignSystem_a7532e;
  const { Button: HBtn, Badge, SectionHead, ProgramCard, ProductCard, BlogCard, StatRow, NewsletterBand } = DS;

  const Sparkle = ({ size = 34, fill = '#F5C842', style }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} style={style}><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
  );

  const Section = ({ bg, style, children }) => (
    <section style={{ padding: '5.5rem 2rem', background: bg, ...style }}>
      <div style={{ maxWidth: 'var(--content-max)', margin: '0 auto' }}>{children}</div>
    </section>
  );

  const GLYPHS = {
    plus: <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FFFDF5" strokeWidth="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>,
    grid: <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FFFDF5" strokeWidth="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16"/></svg>,
    quads: <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FFFDF5" strokeWidth="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
    card: <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FFFDF5" strokeWidth="1.5"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>,
  };

  function HomeScreen({ go }) {
    return (
      <div>
        <header style={{ position: 'relative', minHeight: 560, overflow: 'hidden', background: 'var(--cream)', display: 'flex', alignItems: 'center' }}>
          <img src="assets/hero-children.jpg" alt="Ghanaian children playing cognitive development games" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center' }} />
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(90deg, rgba(255,253,245,0.95) 0%, rgba(255,253,245,0.84) 28%, rgba(255,253,245,0) 58%)' }}></div>
          <div style={{ position: 'relative', zIndex: 2, maxWidth: 'var(--content-max)', margin: '0 auto', width: '100%', padding: '5rem 2rem' }}>
            <div style={{ maxWidth: 560 }}>
              <div style={{ marginBottom: '1.5rem' }}><Badge>Tema, Greater Accra, Ghana</Badge></div>
              <h1 style={{ fontFamily: 'var(--font-serif-display)', fontSize: 'var(--text-hero)', fontWeight: 600, lineHeight: 1.08, letterSpacing: '-0.01em', color: 'var(--ink)', margin: '0 0 1.4rem' }}>
                Every child deserves to <span style={{ color: 'var(--green)', fontStyle: 'italic' }}>catch</span> their potential.
              </h1>
              <p style={{ fontSize: '1.1rem', color: '#4A4438', maxWidth: 480, margin: '0 0 2.2rem', lineHeight: 1.7 }}>
                "Why do some children seem to think faster, solve problems easier, and learn with more confidence?" It usually isn't talent — it's whether their brain was given the chance to develop early. Anyoka Foundation builds the tools that give every Ghanaian child that chance, from birth to age 24.
              </p>
              <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                <HBtn onClick={() => go('Our Resources')}>Explore our resources</HBtn>
                <HBtn variant="outline" style={{ background: 'rgba(255,253,245,0.85)' }} onClick={() => go('Donate')}>Support our mission</HBtn>
              </div>
            </div>
          </div>
        </header>
        <div style={{ background: 'var(--cream-deep)', padding: '2.6rem 2rem', borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)' }}>
          <div style={{ maxWidth: 'var(--content-max)', margin: '0 auto' }}>
            <p style={{ textAlign: 'center', fontSize: '11.5px', fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--gray)', margin: '0 0 1.6rem' }}>Where we stand today</p>
            <div style={{ display: 'flex', justifyContent: 'center', flexWrap: 'wrap' }}>
              {[['📍', 'Founded 2025', 'Tema, Greater Accra, Ghana'], ['📚', '6 products live', 'Anyoka Learning catalogue'], ['⚖️', 'Registering', 'As a Ghanaian NGO'], ['🔍', '100% transparent', 'On how funds are used']].map(([ic, t, s], i, arr) => (
                <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '0 2.2rem', borderRight: i < arr.length - 1 ? '1px solid var(--border)' : 'none' }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: 'var(--green-pale)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.1rem' }}>{ic}</div>
                  <div><strong style={{ display: 'block', fontFamily: 'var(--font-serif-display)', fontSize: '1.1rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.2 }}>{t}</strong><span style={{ fontSize: 12, color: 'var(--gray)' }}>{s}</span></div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <section style={{ padding: '5.5rem 2rem', background: 'var(--ink)', color: 'var(--cream)', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: '-20%', right: '-10%', width: 500, height: 500, background: 'radial-gradient(circle, rgba(245,200,66,0.15) 0%, transparent 70%)' }}></div>
          <div style={{ maxWidth: 800, margin: '0 auto', textAlign: 'center', position: 'relative' }}>
            <p style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--gold)', margin: '0 0 0.8rem' }}>What we believe</p>
            <h2 style={{ fontFamily: 'var(--font-serif-display)', fontSize: 'clamp(2.2rem, 6vw, 4rem)', fontWeight: 600, margin: '0 0 1.2rem' }}>Anyoka means <span style={{ color: 'var(--gold)', fontStyle: 'italic' }}>"to catch."</span></h2>
            <p style={{ fontSize: '1.15rem', color: 'rgba(255,253,245,0.78)', lineHeight: 1.8, maxWidth: 620, margin: '0 auto' }}>Our mission is to help children catch opportunities, catch knowledge, catch confidence, and catch their full potential — because a child who is never given the tools to think critically often can't catch the chances placed in front of them.</p>
            <div style={{ display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap', marginTop: '2.2rem' }}>
              {['Catch opportunities', 'Catch knowledge', 'Catch confidence', 'Catch potential'].map((c) => <Badge key={c} tone="gold" style={{ letterSpacing: '0.03em', textTransform: 'none', fontSize: 13, padding: '8px 18px' }}>{c}</Badge>)}
            </div>
          </div>
        </section>
        <Section>
          <SectionHead center label="What we do" title="Three ways we build brighter minds"
            desc="From everyday games to a future campus, every Anyoka programme is designed around one idea: cognitive development should start early, and should belong to every child." />
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1.6rem' }}>
            <ProgramCard icon="🧩" title="Cognitive Development Games" linkLabel="Explore the games" onClick={() => go('Programs')}>Purposefully designed games and digital resources that build memory, attention, problem-solving, and creative thinking — for ages 1 to 24.</ProgramCard>
            <ProgramCard icon="🏫" iconBg="var(--orange-pale)" iconColor="var(--orange)" title="Cognitive Summer School" linkLabel="See the programme" onClick={() => go('Programs')}>An immersive holiday programme where every activity, from play to structured learning, is rooted in building cognitive strength.</ProgramCard>
            <ProgramCard icon="🏗️" iconBg="var(--purple-pale)" iconColor="var(--purple)" title="Educational Complex" linkLabel="Read our big dream" onClick={() => go('Programs')}>Our flagship future project: Ghana's first dedicated cognitive development educational complex, serving ages 1 to 24, right here in Tema.</ProgramCard>
          </div>
        </Section>
        <Section bg="var(--cream-deep)">
          <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem', marginBottom: '2.5rem' }}>
            <div>
              <Badge tone="plain">Anyoka Learning — browse &amp; buy at anyokalearning.com</Badge>
              <h2 style={{ fontFamily: 'var(--font-serif-display)', fontSize: 'var(--text-h2)', fontWeight: 600, margin: '0.8rem 0 0.6rem' }}>"What can I actually do at home, today?"</h2>
              <p style={{ color: 'var(--gray)', fontSize: '0.98rem', maxWidth: 480, margin: 0 }}>That's the question every parent asks us. These six resources are our answer — practical, affordable, and available now on Anyoka Learning.</p>
            </div>
            <HBtn variant="outline" onClick={() => go('Our Resources')}>See all resources</HBtn>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '1.4rem' }}>
            <ProductCard color="var(--green)" tag="Digital · PDF" age="Ages 4 to 10" title="Brain Booster Activity Book" price="GHS 45" glyph={GLYPHS.plus} />
            <ProductCard color="var(--orange)" tag="Digital · PDF" age="Ages 5 to 12" title="Weekly Cognitive Worksheet Pack" price="GHS 65" glyph={GLYPHS.grid} />
            <ProductCard color="var(--purple)" tag="Physical" age="Ages 5 to 10" title="Cognitive Jigsaw Puzzle" price="GHS 60" glyph={GLYPHS.quads} />
            <ProductCard color="var(--pink)" tag="Physical" age="Ages 3 to 8" title="Cognitive Flashcard Sets" price="GHS 35" glyph={GLYPHS.card} />
          </div>
        </Section>
        <Section>
          <div style={{ background: 'linear-gradient(135deg, var(--green) 0%, #0A5242 100%)', color: '#fff', borderRadius: 'var(--radius-hero)', padding: '4.5rem 3rem', position: 'relative', overflow: 'hidden' }}>
            <div style={{ position: 'absolute', bottom: '-30%', left: '-10%', width: 400, height: 400, borderRadius: '50%', background: 'rgba(245,200,66,0.10)' }}></div>
            <div style={{ maxWidth: 680, position: 'relative' }}>
              <p style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--gold)', margin: '0 0 0.8rem' }}>Our big dream</p>
              <h2 style={{ fontFamily: 'var(--font-serif-display)', fontSize: 'clamp(1.8rem, 3.5vw, 2.5rem)', fontWeight: 600, margin: '0 0 1.2rem' }}>Ghana's first cognitive development educational complex.</h2>
              <p style={{ color: 'rgba(255,253,245,0.85)', fontSize: '1.05rem', lineHeight: 1.8, margin: '0 0 2rem' }}>We are building a world-class facility in Tema where children from age 1 through young adulthood at 24 are immersed in an environment built to help them catch every ounce of their potential.</p>
              <HBtn variant="gold" onClick={() => go('Donate')}>Help us build it</HBtn>
            </div>
          </div>
        </Section>
        <Section style={{ paddingTop: 0 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '3rem', alignItems: 'center' }}>
            <div>
              <SectionHead label="School donations" title="Give a child a brain boost."
                desc="We donate cognitive development kits, flashcards, puzzles, and activity books to under-resourced schools across Ghana. Sponsor a kit, or apply on behalf of your school." style={{ marginBottom: '2rem' }} />
              <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                <HBtn onClick={() => go('School Donations')}>Sponsor a kit</HBtn>
                <HBtn variant="outline" onClick={() => go('School Donations')}>Apply as a school</HBtn>
              </div>
            </div>
            <StatRow stats={[
              { value: 'GHS 2000', label: 'funds one classroom cognitive kit' },
              { value: '0', label: 'schools reached so far — help us start the count' },
              { value: '100%', label: 'of kit sponsorships go directly to materials' },
            ]} />
          </div>
        </Section>
        <Section style={{ paddingTop: 0, paddingBottom: '5.5rem' }}>
          <NewsletterBand />
        </Section>
      </div>
    );
  }

  // =====================
  // ABOUT SCREEN
  // =====================
  const ADS = window.AnyokaFoundationDesignSystem_a7532e;
  const { Button: ABtn } = ADS;

  const aboutLbl = (color = 'var(--gold-deep)', center) => ({ fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color, margin: '0 0 0.8rem', textAlign: center ? 'center' : 'left' });
  const aboutTitle = (center, mb = '1.2rem') => ({ fontFamily: 'var(--font-serif-display)', fontSize: 'clamp(1.7rem, 3vw, 2.3rem)', fontWeight: 600, lineHeight: 1.2, margin: `0 ${center ? 'auto' : '0'} ${mb}`, color: 'var(--ink)', textAlign: center ? 'center' : 'left', maxWidth: center ? 600 : undefined });

  function AboutScreen({ go }) {
    return (
      <div style={{ fontFamily: 'var(--font-sans)' }}>
        <header style={{ position: 'relative', overflow: 'hidden', background: 'var(--cream)', padding: '4.5rem 2rem 5rem' }}>
          <style>{'@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}'}</style>
          <div style={{ maxWidth: 'var(--content-max)', margin: '0 auto', display: 'grid', gridTemplateColumns: '1.15fr 0.85fr', gap: '4rem', alignItems: 'center' }}>
            <div>
              <p style={aboutLbl('var(--green)')}>About Anyoka Foundation</p>
              <h1 style={{ fontFamily: 'var(--font-serif-display)', fontSize: 'var(--text-hero)', fontWeight: 600, margin: '0 0 1.3rem', lineHeight: 1.08, letterSpacing: '-0.01em', color: 'var(--ink)' }}>A name that means <em style={{ color: 'var(--green)' }}>to catch</em>, and a mission to match.</h1>
              <p style={{ fontSize: '1.1rem', color: 'var(--gray)', maxWidth: 520, margin: '0 0 2rem', lineHeight: 1.7 }}>We're a Ghanaian non-governmental organisation working to make sure no child's potential goes unclaimed — founded in 2025 in Tema, Greater Accra.</p>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                {['Catch opportunities', 'Catch knowledge', 'Catch confidence', 'Catch potential'].map((c) => (
                  <span key={c} style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--green)', border: '1px solid rgba(15,110,86,0.3)', padding: '8px 18px', borderRadius: 'var(--radius-pill)' }}>{c}</span>
                ))}
              </div>
            </div>

  const SCREENS = {

    'About': (go) => <AboutScreen go={go} />,

    'Contact': (go) => <ContactScreen go={go} />,
    'Free Games': (go) => <FreeGamesScreen go={go} />,
    'Anyoka Play': (go) => <AnyokaPlayScreen go={go} />,
  };

  function App() {
    const getInitial = () => {
      try { return localStorage.getItem('anyoka-screen') || 'Home'; } catch { return 'Home'; }
    };
    const [screen, setScreen] = React.useState(getInitial());
    const go = (s) => {
      setScreen(s);
      try { localStorage.setItem('anyoka-screen', s); } catch {}
      window.scrollTo(0, 0);
    };
    const render = SCREENS[screen] || SCREENS['Home'];
    return (
      <div>
        <SiteNavBar active={screen} onNavigate={go} />
        {render(go)}
        <Footer go={go} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
